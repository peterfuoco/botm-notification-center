services:
  mysql:
    # MySQL 8.0 matches Aurora MySQL 3.
    image: mysql:8.0
    container_name: botm-notifications-mysql
    environment:
      MYSQL_ROOT_PASSWORD: localdev
      MYSQL_DATABASE: notifications
      TZ: UTC
    command: ['--default-time-zone=+00:00']
    ports:
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      # *.sql files here run alphabetically on first start (empty volume only):
      # schema.sql, then seed.sql. Use `npm run db:reset` after schema changes.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-plocaldev']
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
